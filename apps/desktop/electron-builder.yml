appId: com.openrigor.canvas
productName: OpenRigor
electronVersion: 33.4.11
directories:
  output: release
files:
  - out/**
asar: true
win:
  # Cross-builds from Linux/WSL cannot sign/rcedit without Wine.
  signAndEditExecutable: false
  target:
    - dir
    - portable
linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: OpenRigor <noreply@users.noreply.github.com>
  executableName: openrigor-canvas
deb:
  packageName: openrigor-canvas
artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  target:
    - dmg
  category: public.app-category.productivity
